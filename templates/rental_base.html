{% load django_bootstrap5 %}
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}yumyum{% endblock %}</title>
  {% block extra_head %}{% endblock %}
  {% bootstrap_css %}
</head>
<body>
  <header class="border-bottom px-5 py-3">
    <a href="" class="fs-5 text-body text-decoration-none">
        yumyum
    </a>
  </header>

  <main class="container text-center py-4">
    {% block content %}{% endblock %}
  </main>

  {% bootstrap_javascript %}
  {% block extra_js %}{% endblock %}
</body>
</html>
