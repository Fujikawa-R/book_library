{% load static %}

<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>yom yom | ログイン</title>
    <link rel="stylesheet" href="{% static 'css/phone/login.css' %}">
</head>
<body>

<main class="login-page">
    <div class="login-container">

        <div class="login-header">
            <h1>yom yom</h1>
            <p>図書管理システム</p>
        </div>

        {% if user.is_authenticated %}

            <div class="login-card">
                <h2>ログイン中</h2>
                <p>{{ user.email }}</p>

                <a href="{% url 'phone:mypage' %}" class="login-button">
                    マイページへ
                </a>
            </div>

        {% else %}

            <div class="login-card">
                <h2>ログイン</h2>

                {% if form.non_field_errors %}
                    <div class="error-message">
                        {{ form.non_field_errors }}
                    </div>
                {% endif %}

<form method="post" action="{% url 'phone:login' %}">                   
     {% csrf_token %}

                    <input type="hidden" name="next" value="{{ next }}">

                    <div class="form-group">
                        <label for="id_username">メールアドレス</label>
                        <input
                            type="email"
                            id="id_username"
                            name="username"
                            placeholder="メールアドレスを入力"
                            autocomplete="username"
                            value="{{ form.username.value|default_if_none:'' }}"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="id_password">パスワード</label>
                        <input
                            type="password"
                            id="id_password"
                            name="password"
                            placeholder="パスワードを入力"
                            autocomplete="current-password"
                            required
                        >
                    </div>

                    <button type="submit" class="login-button">
                        ログイン
                    </button>
                </form>
            </div>

        {% endif %}

    </div>
</main>

</body>
</html>
