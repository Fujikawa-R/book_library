{% extends "rental_base.html" %}
{% load django_bootstrap5 %}

{% block title %}待機画面{% endblock %}

{% block content %}
<div class="d-flex justify-content-center align-items-center gap-4" style="height: 60vh;">
  <a class="btn btn-outline-dark btn-lg px-5 py-5 fs-3 w-100" href="{% url 'rental:isbn_scan' 'loan' %}">貸出</a>
  <a class="btn btn-outline-dark btn-lg px-5 py-5 fs-3 w-100" href="{% url 'rental:isbn_scan' 'return' %}">返却</a>
</div>
{% endblock %}

{% bootstrap_javascript %}
{% block extra_js %}
<script>
// 待機画面に戻ったら、読み取り途中の一覧を消す
sessionStorage.removeItem("selectedBooks_loan");
sessionStorage.removeItem("selectedBooks_return");
</script>
{% endblock %}
