{% extends "phone_base.html" %}
{% load static %}

{% block title %}設定{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/phone/settings.css' %}">
{% endblock %}

{% block content %}

<main class="setting-page">
    <div class="setting-container">

        <!-- 学籍番号 -->
        <div class="student-header">
            <div>
                <p class="student-label">学籍番号</p>
                <h1 id="student-id">{{ student.student_no }}</h1>
            </div>
            <div class="student-icon">👤</div>
        </div>

        <h2 class="setting-title">アカウント設定</h2>

        <form method="post" id="setting-form" class="setting-form">
            {% csrf_token %}

            <!-- 名前 -->
            <div class="form-group">
                <label for="student_name">名前</label>
                <input type="text" id="student_name" name="student_name" value="{{ student.student_name }}"
                    autocomplete="name" maxlength="50" readonly required>
            </div>

            <!-- メールアドレス -->
            <div class="form-group">
                <label for="email">メールアドレス</label>
                <input type="email" id="email" name="email" value="{{ student.user.email }}" autocomplete="email" readonly
                    required>
            </div>

            <!-- 閲覧モードのパスワード -->
            <div class="form-group" id="password-display">
                <label>パスワード</label>
                <div class="password-mask">••••••••</div>
            </div>

            <!-- 編集モードのパスワード -->
            <div class="password-section" id="password-edit" hidden>
                <h3>パスワード変更</h3>

                <!-- 現在のパスワード -->
                <div class="form-group">
                    <label for="current_password">現在のパスワード</label>

                    <div class="password-input-wrapper">
                        <input type="password" id="current_password" name="current_password"
                            autocomplete="current-password" placeholder="現在のパスワード" disabled>

                        <button type="button" class="password-toggle" aria-label="パスワードを表示" aria-pressed="false">
                            <svg class="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z" />
                                <circle cx="12" cy="12" r="3" />
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- 新しいパスワード -->
                <div class="form-group">
                    <label for="new_password">新しいパスワード</label>

                    <div class="password-input-wrapper">
                        <input type="password" id="new_password" name="new_password" autocomplete="new-password"
                            placeholder="新しいパスワード" disabled>

                        <button type="button" class="password-toggle" aria-label="パスワードを表示" aria-pressed="false">
                            <svg class="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z" />
                                <circle cx="12" cy="12" r="3" />
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- 新しいパスワード確認 -->
                <div class="form-group">
                    <label for="confirm_password">
                        新しいパスワード（確認用）
                    </label>

                    <div class="password-input-wrapper">
                        <input type="password" id="confirm_password" name="confirm_password" autocomplete="new-password"
                            placeholder="もう一度入力してください" disabled>

                        <button type="button" class="password-toggle" aria-label="パスワードを表示" aria-pressed="false">
                            <svg class="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z" />
                                <circle cx="12" cy="12" r="3" />
                            </svg>
                        </button>
                    </div>
                </div>
            </div>

            <!-- 学科 -->
            <div class="form-group">
                <label for="department">学科</label>

                <select id="department" name="department" disabled>
                    {% for department in departments %}
                    <option value="{{ department.id }}" {% if student.department_id == department.id %}selected{% endif %}>
                        {{ department }}
                    </option>
                    {% endfor %}
                </select>
            </div>

            <!-- 操作ボタン -->
            <div class="setting-actions">
                <button type="button" class="edit-button" id="edit-button">
                    変更
                </button>

                <button type="button" class="reset-button" id="cancel-button" hidden>
                    キャンセル
                </button>

                <button type="submit" class="save-button" id="save-button" hidden>
                    保存
                </button>
            </div>

        </form>
        <form method="post" action="{% url 'phone:logout' %}">
    {% csrf_token %}

    <button type="submit" class="logout-button">
        ログアウト
    </button>
</form>
    </div>
</main>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<script>
    document.addEventListener("DOMContentLoaded", function () {

        // 要素取得
        const form = document.getElementById("setting-form");
        const studentName = document.getElementById("student_name");
        const email = document.getElementById("email");
        const department = document.getElementById("department");

        const passwordDisplay = document.getElementById("password-display");
        const passwordEdit = document.getElementById("password-edit");

        const editButton = document.getElementById("edit-button");
        const cancelButton = document.getElementById("cancel-button");
        const saveButton = document.getElementById("save-button");

        const passwordInputs = passwordEdit.querySelectorAll("input");
        const passwordToggles = passwordEdit.querySelectorAll(".password-toggle");

        const toast = document.getElementById("toast");
        let toastTimer = null;

        // 親要素の transform / overflow の影響を受けないよう body 直下に移動
        document.body.appendChild(toast);

        // トースト表示
        function showToast(message, type = "success") {
            clearTimeout(toastTimer);

            toast.textContent = message;
            toast.classList.toggle("error", type === "error");
            toast.hidden = false;

            // hidden解除直後にクラスを付けてアニメーションを効かせる
            requestAnimationFrame(() => {
                toast.classList.add("show");
            });

            toastTimer = setTimeout(() => {
                toast.classList.remove("show");
                setTimeout(() => { toast.hidden = true; }, 250);
            }, 2500);
        }

        // サーバー（DB）から表示された値を「保存済み」として扱う
        const savedData = {
            studentName: studentName.value,
            email: email.value,
            department: department.value
        };

        // パスワード欄を初期状態に戻す
        function resetPasswordFields() {
            passwordInputs.forEach(input => {
                input.value = "";
                input.type = "password";
            });

            passwordToggles.forEach(button => {
                button.classList.remove("is-visible");
                button.setAttribute("aria-pressed", "false");
                button.setAttribute("aria-label", "パスワードを表示");
            });
        }

        // 保存済みデータに戻す
        function restoreSavedData() {
            studentName.value = savedData.studentName;
            email.value = savedData.email;
            department.value = savedData.department;

            resetPasswordFields();
        }

        // 閲覧・編集モード切り替え
        function setEditMode(editing) {
            studentName.readOnly = !editing;
            email.readOnly = !editing;
            department.disabled = !editing;

            passwordDisplay.hidden = editing;
            passwordEdit.hidden = !editing;

            passwordInputs.forEach(input => {
                input.disabled = !editing;
            });

            editButton.hidden = editing;
            cancelButton.hidden = !editing;
            saveButton.hidden = !editing;

            form.classList.toggle("editing", editing);
        }

        // 変更ボタン
        editButton.addEventListener("click", function () {
            setEditMode(true);
        });

        // キャンセルボタン
        cancelButton.addEventListener("click", function () {
            restoreSavedData();
            setEditMode(false);
        });

        // 目のアイコンによるパスワード表示・非表示
        passwordToggles.forEach(button => {
            button.addEventListener("click", function () {
                const input = this.parentElement.querySelector("input");

                const isHidden = input.type === "password";

                // パスワードの表示状態を変更
                input.type = isHidden ? "text" : "password";

                // 目のアイコンの状態を変更
                this.classList.toggle("is-visible", isHidden);

                this.setAttribute("aria-pressed", String(isHidden));

                this.setAttribute(
                    "aria-label",
                    isHidden ? "パスワードを非表示" : "パスワードを表示"
                );
            });
        });

        // 保存ボタン
        form.addEventListener("submit", function (event) {
            event.preventDefault();

            if (!form.reportValidity()) {
                return;
            }

            const current = document.getElementById("current_password").value;
            const next = document.getElementById("new_password").value;
            const confirm = document.getElementById("confirm_password").value;

            // パスワードが入力されている場合
            if (current || next || confirm) {

                if (!current || !next || !confirm) {
                    showToast("パスワード変更欄をすべて入力してください。", "error");
                    return;
                }

                if (next !== confirm) {
                    showToast("新しいパスワードが一致しません。", "error");
                    return;
                }

            }

            // 送信直前に disabled を外さないと学科が POST されない
            department.disabled = false;
            passwordInputs.forEach(input => { input.disabled = false; });
            form.submit();
        });

        // 初期表示（エラー時は入力内容を残したまま編集モード）
        {% if error %}
        setEditMode(true);
        showToast("{{ error|escapejs }}", "error");
        {% else %}
        setEditMode(false);
        {% if success %}showToast("{{ success|escapejs }}");{% endif %}
        {% endif %}

    });
</script>

{% endblock %}
